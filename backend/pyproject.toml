[tool.poetry]
name = "talentmind-ai-backend"
version = "0.1.0"
description = "Backend API for TalentMind AI Platform"
authors = ["TalentMind AI Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
sqlalchemy = "^2.0.0"
asyncpg = "^0.28.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = ">=0.24.1"
structlog = "^23.1.0"
alembic = "^1.11.1"
neo4j = "^5.10.0"
faiss-cpu = "^1.7.4"
sentence-transformers = "^2.2.2"
redis = "^5.0.0"
numpy = "<2.0.0"
pandas = "^2.2.2"
cachetools = "^5.5.0"
PyMuPDF = "^1.24.9"
python-multipart = "^0.0.32"
langgraph = "^1.2.11"
langchain-core = "^1.5.4"
nest-asyncio = "^1.6.0"
python-dotenv = "^1.2.2"
langchain-ollama = "^1.1.0"
bcrypt = "<4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
ruff = "^0.0.280"
mypy = "^1.4.1"
pytest-mock = "^3.11.1"
aiosqlite = "^0.19.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
